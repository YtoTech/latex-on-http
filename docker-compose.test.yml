services:
  latex:
    build: .
    command: make start
    ports:
     - "9898:8080"
    volumes:
     - .:/app/latex-on-http
     #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
    environment:
      DATABASE_URL: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      CACHE_HOST: cache
      LATEX_ON_HTTP_API_URL: http://latex:8080
      # Bubblewrap executable fails the suite instead of being skipped
      # If Bubblewrap cannot create namespaces, fix the host/container policy before accepting untrusted compilations.
      LATEX_REQUIRE_SANDBOX_TESTS: 1
      KEEP_WORKSPACE_DIR_ON_ERROR: 1
      GOOSE_DBSTRING: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      TEST_DATABASE_URL: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      # Reduce HTTP fetch read timeout so that resource fetch timeouts can be
      # tested quickly (see tests/test_fetchers.py).
      FETCHER_HTTP_REQ_READ_TIMEOUT: 3
      # Small request-body limit so the 413 REQUEST_TOO_LARGE path can be
      # exercised end to end; every other test payload stays well below it
      # (see tests/test_request_size_limit.py).
      MAX_REQUEST_BODY_BYTES: 1048576
      # Small fetched resource limits (512 KiB) so the RESOURCE_FETCH_FAILURE
      # size paths can be exercised end to end; every other test resource stays
      # well below them (see tests/test_fetchers.py and
      # tests/test_request_size_limit.py).
      MAX_RESOURCE_SIZE: 524288
      MAX_TOTAL_RESOURCE_SIZE: 524288
  cache:
    build:
      context: .
      dockerfile: cache.Dockerfile
    command: make start-cache
    volumes:
     - .:/app/latex-on-http
     #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
  postgres_db:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: latexonhttp
      POSTGRES_PASSWORD: latexdev
      POSTGRES_DB: latexonhttp
    volumes:
      - ./data/postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latexonhttp -d latexonhttp"]
      interval: 2s
      timeout: 2s
      retries: 30
