# Quota integration-test override, layered on docker-compose.test.yml:
#   docker compose -f docker-compose.test.yml -f docker-compose.quota-test.yml ...
# (see the `test-quota` Make target). Adds a Valkey service and low-enough
# limits for the quota tests to trip them; run it ONLY with
# tests/test_quota.py, other tests would exhaust the tiny windows.
services:
  latex:
    environment:
      VALKEY_HOST: valkey
      QUOTA_LIMIT_SECOND: "3"
      # The tests flood at most 15 requests, so the minute window never
      # breaches: the second window stays the only (deterministic) trigger.
      # (The other windows and the ban thresholds keep their code defaults;
      # overriding them here would leak into the unit tier, which runs in
      # this same container and relies on the defaults.)
      QUOTA_LIMIT_MINUTE: "50"
      QUOTA_LIMIT_HOUR: "1000"
      QUOTA_LIMIT_DAY: "1000"
      QUOTA_LIMIT_WEEK: "1000"
  valkey:
    # Deliberately ephemeral, unlike the persisted base-file service: each
    # test run must start from fresh counters and bans.
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
