# Optional override for rootless Docker/Podman hosts that reject nested
# user namespaces. This capability is confined to the rootless daemon's user
# namespace; compilation children still drop all capabilities via Bubblewrap.
# Use only with rootless runtimes, never as a generic rootful-Docker override.
services:
  latex:
    cap_add:
      - SYS_ADMIN
    security_opt:
      # Docker's default seccomp policy has no exception for pivot_root,
      # including when SYS_ADMIN is present. Bubblewrap needs it to finish
      # creating the private root before dropping compilation capabilities.
      - seccomp=./container/seccomp-bubblewrap.json
