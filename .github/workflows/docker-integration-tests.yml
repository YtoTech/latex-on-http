name: docker-integration-tests
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'cache.Dockerfile'
      - 'container/**'
      - 'docker-compose*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'app.py'
      - 'app_cache.py'
      - 'latexonhttp/**'
      - 'tools/**'
      - '.github/workflows/docker-integration-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'cache.Dockerfile'
      - 'container/**'
      - 'docker-compose*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'app.py'
      - 'app_cache.py'
      - 'latexonhttp/**'
      - 'tools/**'
      - '.github/workflows/docker-integration-tests.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build main app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: yoant/latexonhttp:ci
          cache-from: |
            type=gha,ref=latexonhttp-main
            type=registry,ref=yoant/latexonhttp-python:debian
          cache-to: type=gha,mode=max,ref=latexonhttp-main
      - name: Build cache image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cache.Dockerfile
          load: true
          tags: yoant/latexonhttp-cache:ci
          cache-from: type=gha,ref=latexonhttp-cache
          cache-to: type=gha,mode=max,ref=latexonhttp-cache
      - name: Run integration tests
        run: make COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml:docker-compose.ci-images.yml test-docker-compose
      - name: Show application logs on failure
        if: failure()
        run: make COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml:docker-compose.ci-images.yml test-docker-compose-logs
