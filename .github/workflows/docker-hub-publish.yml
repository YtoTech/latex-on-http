name: docker-hub-publish
on:
  release:
    types: [published]

jobs:
  python-tests:
    uses: ./.github/workflows/python-tests.yml

  docker-publish:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push tl-distrib
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/tl-distrib-debian.Dockerfile
          push: true
          tags: yoant/latexonhttp-tl-distrib:debian
          cache-from: type=gha,ref=latexonhttp-tl-distrib
          cache-to: type=gha,mode=max,ref=latexonhttp-tl-distrib
      - name: Build and push python-debian
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/python-debian.Dockerfile
          push: true
          tags: yoant/latexonhttp-python:debian
          cache-from: |
            type=gha,ref=latexonhttp-python-debian
            type=registry,ref=yoant/latexonhttp-tl-distrib:debian
          cache-to: type=gha,mode=max,ref=latexonhttp-python-debian
      - name: Build main app image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: yoant/latexonhttp:ci
          cache-from: |
            type=gha,ref=latexonhttp-main
            type=registry,ref=yoant/latexonhttp-python:debian
      - name: Build cache image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cache.Dockerfile
          load: true
          tags: yoant/latexonhttp-cache:ci
          cache-from: type=gha,ref=latexonhttp-cache
      - name: Run tests
        run: make COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml:docker-compose.ci-images.yml test-docker-compose

