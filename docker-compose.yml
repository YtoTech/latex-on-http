services:
  latex:
    build: .
    # restart: always
    # command: dev
    ports:
     - "8088:8080"
    volumes:
     - .:/app/latex-on-http
     - ./tools:/app/latex-on-http/tools
      #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      CACHE_HOST: cache
      # Quota store; empty disables the quota (see docs/rate-limiting-and-quotas.md).
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      KEEP_WORKSPACE_DIR: 1
      KEEP_WORKSPACE_DIR_ON_ERROR: 0
      GOOSE_DBSTRING: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      DATABASE_URL: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      LOGGING_LEVEL: DEBUG
      DEFAULT_COMPILE_TIMEOUT: 30
    depends_on:
      cache:
        condition: service_started
      postgres_db:
        condition: service_healthy
  cache:
    build:
      context: .
      dockerfile: cache.Dockerfile
    # restart: always
    volumes:
     - .:/app/latex-on-http
     #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
    # environment:
      # SENTRY_DSN: 
    depends_on:
      - postgres_db
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    # Ephemeral quota state: no persistence, bounded memory, LRU eviction.
    command: ["valkey-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  postgres_db:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: latexonhttp
      POSTGRES_PASSWORD: latexdev
      POSTGRES_DB: latexonhttp
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latexonhttp -d latexonhttp"]
      interval: 2s
      timeout: 2s
      retries: 30
  adminer:
    image: docker.io/adminer:latest
    ports:
      - 8092:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
      # ADMINER_DESIGN: nette
      # https://www.adminer.org/plugins/
      ADMINER_PLUGINS: tables-filter
    links:
      - postgres_db
