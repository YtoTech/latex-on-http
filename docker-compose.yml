services:
  latex:
    build: .
    # restart: always
    # command: dev
    ports:
     - "8088:8080"
    volumes:
     - .:/app/latex-on-http
     - ./tools:/app/latex-on-http/tools
      #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      CACHE_HOST: cache
      # Quota store; empty disables the quota (see docs/rate-limiting-and-quotas.md).
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      KEEP_WORKSPACE_DIR: 1
      KEEP_WORKSPACE_DIR_ON_ERROR: 0
      GOOSE_DBSTRING: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      DATABASE_URL: postgres://latexonhttp:latexdev@postgres_db:5432/latexonhttp
      LOGGING_LEVEL: DEBUG
      DEFAULT_COMPILE_TIMEOUT: 30
      # Maximum incoming request body in bytes; empty keeps the code default
      # (40 MiB, see MAX_REQUEST_BODY_BYTES).
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-}
      # Maximum sizes in bytes of the generated PDF and log files returned by
      # the service; empty keeps the code defaults (100 MiB / 10 MiB).
      MAX_PDF_SIZE: ${MAX_PDF_SIZE:-}
      MAX_LOG_FILE_SIZE: ${MAX_LOG_FILE_SIZE:-}
      # Maximum fetched resource sizes in bytes; empty keeps the code defaults
      # (50 MiB per resource, 500 MiB combined, see MAX_RESOURCE_SIZE and
      # MAX_TOTAL_RESOURCE_SIZE). 0 disables a limit.
      MAX_RESOURCE_SIZE: ${MAX_RESOURCE_SIZE:-}
      MAX_TOTAL_RESOURCE_SIZE: ${MAX_TOTAL_RESOURCE_SIZE:-}
    depends_on:
      cache:
        condition: service_started
      postgres_db:
        condition: service_healthy
  cache:
    build:
      context: .
      dockerfile: cache.Dockerfile
    # restart: always
    volumes:
     - .:/app/latex-on-http
     #  Ignore .venv with an anonymous volume.
     - /app/latex-on-http/.venv
    # environment:
      # SENTRY_DSN: 
    depends_on:
      - postgres_db
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    # Quota state: RDB snapshots to ./data/valkey every 60s (and on clean
    # shutdown); bounded memory, LRU eviction.
    command: ["valkey-server", "--save", "60", "1", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/valkey:/data
  postgres_db:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: latexonhttp
      POSTGRES_PASSWORD: latexdev
      POSTGRES_DB: latexonhttp
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latexonhttp -d latexonhttp"]
      interval: 2s
      timeout: 2s
      retries: 30
  adminer:
    image: docker.io/adminer:latest
    ports:
      - 8092:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
      # ADMINER_DESIGN: nette
      # https://www.adminer.org/plugins/
      ADMINER_PLUGINS: tables-filter
    links:
      - postgres_db
